[build]
  publish = "web/site"

[[redirects]]
  from = "/shortban/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/shortban"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
