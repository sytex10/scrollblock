[build]
  publish = "web/site"

[[redirects]]
  from = "/destek"
  to = "/destek.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/destek.html"
  status = 200

[[redirects]]
  from = "/gizlilik"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/shortban/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/shortban/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/shortban"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
